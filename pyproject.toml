[project]
name = "pflaenzli-backend"
version = "0.1.0"
description = "Django REST API backend for the Pflaenzli plant-watering project"
requires-python = ">=3.12"
dependencies = [
    "django==5.0.5",
    "djangorestframework==3.15.1",
    "django-cors-headers==4.3.1",
    "django-environ==0.14.0",
    "django-filter==24.2",
    "requests==2.31.0",
    "gunicorn",
]

[tool.uv]
# This is a Django application, not an installable library.
package = false
# Transitive versions are held to match the pre-uv requirements.txt so switching
# to uv is a pure tooling change. Remove these (and loosen the pins above) when
# upgrading the libraries.
constraint-dependencies = [
    "asgiref==3.8.1",
    "certifi==2024.2.2",
    "charset-normalizer==3.3.2",
    "idna==3.7",
    "sqlparse==0.5.0",
    "typing-extensions==4.11.0",
    "urllib3==2.2.1",
]
