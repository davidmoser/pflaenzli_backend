[project]
name = "pflaenzli-backend"
version = "0.1.0"
description = "Django REST API backend for the Pflaenzli plant-watering project"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0",
    "djangorestframework>=3.16",
    "django-cors-headers>=4.7",
    "django-environ>=0.12",
    "django-filter>=25",
    "requests>=2.32",
    "gunicorn",
]

[tool.uv]
# This is a Django application, not an installable library.
package = false
